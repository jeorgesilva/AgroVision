[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agrovision"
version = "0.1.0"
authors = [
  { name="Jeorge Silva", email="jeorge.c.silva@gmail.com" },
]
description = "Precision Weed Detection & VRA Mapping"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Web framework
    "streamlit>=1.31.0",
    "streamlit-folium>=0.17.0",
    # AI / vision
    "ultralytics>=8.3.80",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    # Geoprocessing
    "rasterio>=1.3.9",
    "geopandas>=0.14.3",
    "shapely>=2.0.2",
    "fiona>=1.9.5",
    "pyproj>=3.6.1",
    # Data
    "numpy>=1.26.3",
    "pandas>=2.2.0",
    "dbfread>=2.0.7",
    # Charts & reports
    "matplotlib>=3.8.2",
    "fpdf2>=2.7.7",
    "Pillow>=10.2.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
agrovision        = "agrovision.interfaces.cli:main"
agrovision-detect = "agrovision.interfaces.cli:run_detection"
agrovision-map    = "agrovision.interfaces.cli:run_vra"
agrovision-ui     = "agrovision.interfaces.streamlit_app:main"

[project.urls]
"Homepage"    = "https://github.com/jeorgesilva/agrovision-ai"
"Bug Tracker" = "https://github.com/jeorgesilva/agrovision-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — unused imports (F401), unused variables (F841)
    "I",    # isort — import ordering
    "UP",   # pyupgrade — modern Python syntax
    "T20",  # flake8-print — flags unintentional print() calls
    "B",    # flake8-bugbear — common bugs and design issues
    "RUF",  # Ruff-native rules
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T201"]  # allow print() inside test helpers
